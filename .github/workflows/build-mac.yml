name: Build Mac

on:
  push:
    branches: [ main, mac ]
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/istiqamah/app/core/**'
      - 'app/src/main/java/com/istiqamah/app/data/Cities.kt'
      - 'app/src/main/assets/content.json'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon (arm64) — M1/M2/M3/M4
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (ম্যাকের হিসাব ও সংরক্ষণ)
        run: ./gradlew -p desktop test --no-daemon

      - name: Build app bundle
        run: ./gradlew -p desktop createDistributable --no-daemon

      - name: Smoke test (চালিয়ে স্ক্রিনশট)
        env:
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Dhaka
        run: |
          APP=desktop/build/compose/binaries/main/app/Istiqamah.app
          mkdir -p shots
          for m in today settings call full; do
            ISTIQAMAH_DEMO=$m "$APP/Contents/MacOS/Istiqamah" > "shots/$m.log" 2>&1 &
            PID=$!
            sleep 14
            screencapture -x "shots/$m.png" || true
            if ! kill -0 $PID 2>/dev/null; then echo "::error::app exited early ($m)"; cat "shots/$m.log"; exit 1; fi
            kill $PID || true
            sleep 2
          done
          ls -la shots
          tail -n 30 shots/*.log

      - name: Screenshots for review (mac branch only)
        if: github.ref == 'refs/heads/mac'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-ci-shots >/dev/null 2>&1 || gh release create mac-ci-shots --title "CI screenshots (temporary)" --notes "temporary" --prerelease --target "$GITHUB_SHA"
          gh release upload mac-ci-shots shots/*.png --clobber

      - name: Ad-hoc sign + DMG
        run: |
          set -e
          V=$(grep -E '^val macVersion' desktop/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "V=$V" >> "$GITHUB_ENV"
          APP=desktop/build/compose/binaries/main/app/Istiqamah.app
          test -d "$APP"
          # Apple Silicon-এ চালাতে অন্তত ad-hoc সই লাগে (ডেভেলপার আইডি নেই)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/Istiqamah"
          lipo -archs "$APP/Contents/runtime/Contents/Home/lib/libjli.dylib"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Istiqamah" -srcfolder "$STAGE" -ov -format UDZO "istiqamah-mac-v$V.dmg"
          shasum -a 256 "istiqamah-mac-v$V.dmg"
          ls -la "istiqamah-mac-v$V.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: istiqamah-mac
          path: istiqamah-mac-v*.dmg

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="ইস্তিকামাহ — ম্যাকের মেনু বার অ্যাপ (Apple Silicon)। প্রথমবার খুলতে: DMG থেকে Applications-এ টেনে নিন, খুলুন; আটকালে System Settings → Privacy & Security → Open Anyway।"
          if gh release view "mac-v$V" >/dev/null 2>&1; then
            gh release upload "mac-v$V" "istiqamah-mac-v$V.dmg" --clobber
          else
            gh release create "mac-v$V" "istiqamah-mac-v$V.dmg" --title "ইস্তিকামাহ ম্যাক v$V" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
